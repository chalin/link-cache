name: publish

# Auth: npm trusted publishing (OIDC). Rationale in _docs/supply-chain.md,
# one-time setup in _docs/release.md.

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    # A prerelease would land on the default dist-tag.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token that npm trusted publishing exchanges for publish rights
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # A restored cache is only an injection path.
          package-manager-cache: false
      - name: Check that the release tag matches the package version
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: npm publish --ignore-scripts
