name: publish

# Publishes to the npm registry when a GitHub release is published.
# Auth: npm trusted publishing (OIDC) — configure on npmjs.com under
# package Settings > Trusted Publisher (repo chalin/link-cache, workflow
# publish.yaml). Provenance is generated automatically. No npm token needed.

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm run check
      - name: Check that the release tag matches the package version
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: npm publish
