name: zizmor

# Workflow lint through the OpenTelemetry shared workflow. Rationale in
# _docs/supply-chain.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 45 9 * * 5
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@f09a36e1fa2576787fe05cbc1313ef6066918c78 # v0.23.0
    with: { persona: pedantic }
