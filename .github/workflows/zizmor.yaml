name: zizmor

# Workflow lint through the OpenTelemetry shared workflow. Rationale in
# _docs/supply-chain.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 45 9 * * 5
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@0cc57aeabf2a31cf41114e7b24561f21a04e360b # v0.18.0
    with: { persona: pedantic }
