name: zizmor

# Findings land in the Security tab; the `main` ruleset's code-scanning rule is
# what blocks a merge on them (the step itself passes in SARIF mode).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 45 9 * * 5 # weekly: re-runs the online audits against new advisories
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@68c7b2f0ef9cd9c1e2b71d3018f63127be189578 # v0.14.0
