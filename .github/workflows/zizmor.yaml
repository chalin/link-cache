name: zizmor

# Workflow lint through the OpenTelemetry shared workflow. Rationale in
# _docs/supply-chain.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 45 9 * * 5
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@efc55838c9769c5476e0a5cf7183a8c5b4ae70a5 # v0.24.0
    with: { persona: pedantic }
