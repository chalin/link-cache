name: zizmor

# Workflow lint through the OpenTelemetry shared workflow. Rationale in
# _docs/supply-chain.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 45 9 * * 5
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@ad1959372f2919fcf2556d3a3d12ed5265c54209 # v0.16.0
    with: { persona: pedantic }
