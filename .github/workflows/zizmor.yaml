name: zizmor

# Workflow lint through the OpenTelemetry shared workflow. Rationale in
# _docs/supply-chain.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 45 9 * * 5
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@c717adbcb56efc45c5dea293accfc6c3462bcdd1 # v0.19.0
    with: { persona: pedantic }
